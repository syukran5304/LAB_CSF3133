<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial-scale-1.0"> 
    <title>Bootstrap \index(Bootstrap) Forms \index(Forms (HTML))</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap05.3.0/dist/cas/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container at-5">
        <form>
            <div class="mb-3">
                <label for="inputEmail clasa-form-label">Email address</label> 
                <input type="email" class="form-control" id="inputEmail" placeholder="name@example.com">
            </div>
            <div class="ab-3">
                <label for="inputPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="InputPassword">
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-Input" id="exampleCheck">
                <label class="form-check-label" for="exampleCheck">Remember me
                </label>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Submit</button>
        </form>
    </div>
</body>
</html>
