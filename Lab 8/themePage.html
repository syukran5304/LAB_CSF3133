<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Themed Bootstrap Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <header class="bg-blue-600 text-white text-center py-16">
        <h1 class="text-4xl font-bold mb-2">Welcome to My Themed Page</h1>
        <p class="text-lg">Using a Bootstrap theme</p>
    </header>
    <main class="max-w-6xl mx-auto mt-12 px-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            <div>
                <h2 class="text-2xl font-semibold mb-4">About</h2>
                <p class="text-gray-600">
                    This theme gives a fresh and modern look to your website.
                </p>
            </div>
            <div>
                <img 
                    src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f"
                    alt="Modern workspace"
                    class="w-full rounded-lg shadow-lg"
                >
            </div>
        </div>
    </main>
</body>
</html>
