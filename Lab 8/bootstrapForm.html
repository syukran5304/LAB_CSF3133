<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap CSS Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <!-- Basic Form -->
    <form class="mb-4">
        <div class="mb-3">
            <label for="exampleInputEmail" class="form-label">Email address</label>
            <input type="email" class="form-control" id="exampleInputEmail" placeholder="name@example.com">
        </div>
        <div class="mb-3">
            <label for="exampleInputPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="exampleInputPassword">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <!-- Horizontal Form -->
    <form class="mb-4">
        <div class="row mb-3">
            <label for="inputEmail" class="col-sm-2 col-form-label">Email</label>
            <div class="col-sm-10">
                <input type="email" class="form-control" id="inputEmail">
            </div>
        </div>
        <div class="row mb-3">
            <label for="inputPassword" class="col-sm-2 col-form-label">Password</label>
            <div class="col-sm-10">
                <input type="password" class="form-control" id="inputPassword">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <!-- Search Form -->
    <form class="d-flex mb-4">
        <input class="form-control me-2" type="search" placeholder="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
    </form>
    <!-- Textarea -->
    <div class="mb-3">
        <label for="exampleTextarea" class="form-label">Example Textarea</label>
        <textarea class="form-control" id="exampleTextarea" rows="3"></textarea>
    </div>
    <!-- Select -->
    <div class="mb-4">
        <label for="exampleSelect" class="form-label">Select Example</label>
        <select class="form-select" id="exampleSelect">
            <option>Option 1</option>
            <option>Option 2</option>
            <option>Option 3</option>
        </select>
    </div>
    <!-- Validation -->
    <form class="mb-4">
        <div class="mb-3">
            <label for="validationExample" class="form-label">Username</label>
            <input type="text" class="form-control is-valid" id="validationExample" value="Correct Input">
            <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="mb-3">
            <label for="validationExampleInvalid" class="form-label">Password</label>
            <input type="password" class="form-control is-invalid" id="validationExampleInvalid">
            <div class="invalid-feedback">Please choose a stronger password.</div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <!-- Checkbox -->
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="exampleCheck">
        <label class="form-check-label" for="exampleCheck">Check me out</label>
    </div>
    <!-- Radio Buttons -->
    <div class="form-check">
        <input class="form-check-input" type="radio" name="exampleRadios" id="radio1" checked>
        <label class="form-check-label" for="radio1">Option 1</label>
    </div>
    <div class="form-check mb-4">
        <input class="form-check-input" type="radio" name="exampleRadios" id="radio2">
        <label class="form-check-label" for="radio2">Option 2</label>
    </div>
    <!-- Input Group -->
    <div class="input-group mb-4">
        <span class="input-group-text">@</span>
        <input type="text" class="form-control" placeholder="Username">
    </div>
    <!-- Floating Label -->
    <div class="form-floating mb-4">
        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
        <label for="floatingInput">Email address</label>
    </div>
    <!-- Disabled & Readonly -->
    <input type="text" class="form-control mb-2" placeholder="Disabled input" disabled>
    <input type="text" class="form-control" placeholder="Readonly input" readonly>
</body>
</html>
