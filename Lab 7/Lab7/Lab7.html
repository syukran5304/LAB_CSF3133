<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab Exercise 7 </title>
    <link rel="stylesheet" href="Lab7.css" />
</head>
<body>
<nav class="top-nav">
    <a href="#home">Home</a>
    <a href="#profile">Profile</a>
    <a href="#progress">Progress</a>
    <a href="#faq">FAQ</a>
</nav>
<section id="home" class="hero">
    <div class="hero-text">
        <h1>Welcome</h1>
        <p>Advanced Web Design & Interaction</p>
    </div>
    <form class="login-form" id="loginForm">
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
    </form>
</section>
<section class="slideshow">
    <img class="slide active" src="https://picsum.photos/700/300?1" />
    <img class="slide" src="https://picsum.photos/700/300?2" />
    <img class="slide" src="https://picsum.photos/700/300?3" />
</section>
<section id="profile" class="profile-card">
    <img src="https://picsum.photos/150" alt="Profile" />
    <h3 id="profileName">Guest User</h3>
    <!-- Password removed here -->
    <p>Web Developer</p>
    <div class="social">
        <span>🌐</span>
        <span>📘</span>
        <span>📸</span>
    </div>
</section>
<section id="progress">
    <h2>Progress</h2>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <button id="increaseProgress">Increase</button>
</section>
<section id="faq">
    <button class="collapsible">What is this website?</button>
    <div class="collapsible-content">
        <p>This website is created for Lab Exercise 7.</p>
    </div>
</section>
 <footer>
    <p>Lab Exercise 7 © 2025 Muhammad Syukran</p>
  </footer>
<script src="Lab7.js"></script>
</body>
</html>
